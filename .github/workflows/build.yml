name: Build image artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: this workflow executes PR-controlled build code
# (the Justfile and build scripts come from the PR head), so the workflow-wide
# token is read-only. No job that runs on `pull_request` holds a write token;
# contents: write is granted only to `release`, which is gated to main.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up just
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: just@1.58.0

      # Releases from main are signed with the project keys (a base64 tarball
      # of files/boot-keys/). Pull requests get throwaway keys: their images
      # boot in CI's QEMU check but are never published.
      - name: Install signing keys
        env:
          BOOT_KEYS_TARBALL: ${{ github.ref == 'refs/heads/main' && secrets.BOOT_KEYS_TARBALL || '' }}
        run: |
          set -euo pipefail
          if [ -n "${BOOT_KEYS_TARBALL}" ]; then
            mkdir -p files/boot-keys
            echo "${BOOT_KEYS_TARBALL}" | base64 -d | tar -xz -C files/boot-keys
          elif [ "${GITHUB_REF}" = refs/heads/main ]; then
            echo "BOOT_KEYS_TARBALL is required to build releases on main" >&2
            exit 1
          else
            just gen-dev-keys
          fi

      # One version per build, increasing under strverscmp(). Pull requests
      # use a 0.* version so they can never sort above a release.
      - name: Set image version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" = refs/heads/main ]; then
            V="$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          else
            V="0.${GITHUB_RUN_NUMBER}"
          fi
          just set-version "${V}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Validate Element Graph
        run: just validate

      - name: Set up runner disk space
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/podman /mnt/buildstream
          sudo chown -R "$USER:$USER" /mnt/podman /mnt/buildstream
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/storage.conf <<EOF
          [storage]
          driver = "overlay"
          runroot = "/run/user/1001"
          graphroot = "/mnt/podman"
          EOF
          mkdir -p ~/.cache
          ln -sf /mnt/buildstream ~/.cache/buildstream

      - name: Build and export the image set
        run: just export-image

      - name: Build and export the k0s and OpenZFS sysexts
        run: |
          just export-sysext
          just export-zfs-sysext

      - name: Upload image artifacts for the boot test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: dist/diskless/
          if-no-files-found: error
          retention-days: 1

      - name: Sign release SHA256SUMS manifest
        if: github.ref == 'refs/heads/main'
        env:
          SYSUPDATE_SIGNING_KEY: ${{ secrets.SYSUPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp dist/diskless/bluefin-server_*.raw dist/diskless/bluefin-server-*.efi dist/release/
          cp dist/diskless/bluefin-server-netboot_*.esp.raw dist/release/
          cp dist/sysext/k0s-*.raw.zst dist/sysext/zfs-*.raw.zst dist/release/
          (cd dist/release && sha256sum --binary -- * > SHA256SUMS)
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          echo "$SYSUPDATE_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor -o dist/release/SHA256SUMS.gpg dist/release/SHA256SUMS

      # Hand the signed assets to the release job below; the build job itself
      # stays read-only, so it cannot publish the release.
      - name: Upload release assets artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  # Secure Boot QEMU boots of the built images: diskless (network pull,
  # dm-verity /usr, tmpfs root) and diskless -> systemd-sysinstall -> disk.
  boot-test:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Download image artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: image
          path: dist/diskless

      - name: Install QEMU and OVMF
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          sudo chmod 666 /dev/kvm

      - name: Diskless boot
        run: bash scripts/dogfood-diskless.sh dist/diskless --check

      - name: Install to disk and boot it
        run: bash scripts/dogfood-install.sh dist/diskless

  # Publishes the signed assets as a new, immutable GitHub Release. Only runs
  # on pushes/dispatches to main, where the code is already reviewed, and is
  # the only job in this workflow that holds contents: write.
  release:
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' }}
    needs: [build, boot-test]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write # creates the GitHub Release and uploads its assets
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist/release

      # A version is published exactly once: creating an existing tag fails
      # the job instead of overwriting assets that nodes may already trust.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="${{ needs.build.outputs.version }}"
          gh release create "v${V}" dist/release/* \
            --title "Bluefin Server ${V}" \
            --notes "Image ${V} built from ${GITHUB_SHA}."
